<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --danger: #ef4444;
      --gold: #f59e0b;
      --canvas-bg: #020617;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .game-container {
      background-color: var(--card-bg);
      border-radius: 1rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 480px;
      width: 100%;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--accent);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .title span {
      color: var(--text-main);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-value.highlight {
      color: var(--gold);
    }

    .canvas-wrapper {
      position: relative;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
      background-color: var(--canvas-bg);
    }

    canvas {
      display: block;
      background-color: var(--canvas-bg);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .overlay.game-over h2 {
      color: var(--danger);
    }

    .overlay.paused h2 {
      color: var(--gold);
    }

    .overlay p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .btn {
      background: var(--accent);
      color: #022c22;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 0.5rem;
      padding: 0.6rem 1.4rem;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease, box-shadow 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      filter: brightness(1.2);
      box-shadow: none;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 0.5rem;
    }

    .speed-select {
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 0.4rem 0.6rem;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .icon-btn {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 0.5rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .icon-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    /* D-PAD for Mobile / Touch */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 6px;
      margin-top: 0.5rem;
    }

    .d-btn {
      background: var(--border-color);
      color: var(--text-main);
      border: none;
      border-radius: 0.5rem;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .d-btn:active {
      background: var(--accent);
      color: #022c22;
    }

    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }

    .instructions {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }

    .instructions kbd {
      background: #000;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header">
      <div class="title">
        🐍 <span>Snake</span>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button id="soundToggleBtn" class="icon-btn" title="Activar/Silenciar sonido">
          🔊
        </button>
        <button id="pauseBtn" class="icon-btn" title="Pausar juego">
          ⏸
        </button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-label">Puntaje</span>
        <span id="scoreEl" class="stat-value">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Récord</span>
        <span id="highScoreEl" class="stat-value highlight">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Nivel</span>
        <span id="levelEl" class="stat-value">1</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      
      <!-- Start / Pause / Game Over Overlay -->
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">¿Listo?</h2>
        <p id="overlaySubtitle">Presiona Jugar o pulsa Espacio</p>
        <button id="startBtn" class="btn">
          ▶ Iniciar Juego
        </button>
      </div>
    </div>

    <div class="controls-row">
      <div style="display: flex; align-items: center; gap: 0.4rem;">
        <label for="difficultySelect" style="font-size: 0.8rem; color: var(--text-muted);">Dificultad:</label>
        <select id="difficultySelect" class="speed-select">
          <option value="easy">Fácil</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Difícil</option>
        </select>
      </div>
      <button id="restartBtn" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.4rem 0.8rem;">
        Reiniciar
      </button>
    </div>

    <!-- Mobile Virtual Controls -->
    <div class="d-pad">
      <button class="d-btn d-up" id="btnUp">▲</button>
      <button class="d-btn d-left" id="btnLeft">◀</button>
      <button class="d-btn d-down" id="btnDown">▼</button>
      <button class="d-btn d-right" id="btnRight">▶</button>
    </div>

    <p class="instructions">
      Usa las <kbd>Flechas</kbd> o <kbd>W A S D</kbd> para moverte.<br>
      <kbd>Espacio</kbd> para pausar, <kbd>Enter</kbd> para reiniciar.
    </p>
  </div>

  <script>
    // --- Audio System (Web Audio API) ---
    class SoundController {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }

      playTone(freq, type, duration, gainValue = 0.15) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(gainValue, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.warn('Audio playback error', e);
        }
      }

      playEat() {
        this.playTone(587.33, 'sine', 0.1, 0.2); // D5
        setTimeout(() => this.playTone(880, 'sine', 0.15, 0.2), 60); // A5
      }

      playSpecialEat() {
        this.playTone(523.25, 'triangle', 0.08, 0.25);
        setTimeout(() => this.playTone(659.25, 'triangle', 0.08, 0.25), 60);
        setTimeout(() => this.playTone(783.99, 'triangle', 0.08, 0.25), 120);
        setTimeout(() => this.playTone(1046.50, 'triangle', 0.18, 0.25), 180);
      }

      playGameOver() {
        this.playTone(261.63, 'sawtooth', 0.2, 0.25);
        setTimeout(() => this.playTone(196.00, 'sawtooth', 0.2, 0.25), 150);
        setTimeout(() => this.playTone(130.81, 'sawtooth', 0.35, 0.3), 300);
      }

      playClick() {
        this.playTone(400, 'triangle', 0.04, 0.05);
      }
    }

    // --- Game Logic ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('scoreEl');
    const highScoreEl = document.getElementById('highScoreEl');
    const levelEl = document.getElementById('levelEl');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySubtitle = document.getElementById('overlaySubtitle');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const restartBtn = document.getElementById('restartBtn');
    const difficultySelect = document.getElementById('difficultySelect');

    const GRID_SIZE = 20; // 20x20 cells
    const CELL_SIZE = canvas.width / GRID_SIZE; // 20px

    const SPEED_MAP = {
      easy: 140,
      normal: 100,
      hard: 70
    };

    const sounds = new SoundController();

    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 15, y: 10, special: false };
    let specialFoodTimer = null;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
    let level = 1;
    let isRunning = false;
    let isPaused = false;
    let isGameOver = false;
    let gameLoopTimeout = null;
    let baseSpeed = SPEED_MAP.normal;
    let particles = [];

    highScoreEl.textContent = highScore;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      level = 1;
      particles = [];
      scoreEl.textContent = score;
      levelEl.textContent = level;
      baseSpeed = SPEED_MAP[difficultySelect.value] || SPEED_MAP.normal;
      isGameOver = false;
      isPaused = false;
      spawnFood();
    }

    function spawnFood() {
      let valid = false;
      let newFood = {};
      const isSpecial = Math.random() < 0.2; // 20% de probabilidad de manzana dorada

      while (!valid) {
        newFood = {
          x: Math.floor(Math.random() * GRID_SIZE),
          y: Math.floor(Math.random() * GRID_SIZE),
          special: isSpecial
        };

        valid = !snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
      }

      food = newFood;

      if (specialFoodTimer) clearTimeout(specialFoodTimer);
      if (food.special) {
        // La comida especial desaparece después de 7 segundos
        specialFoodTimer = setTimeout(() => {
          if (isRunning && food.special) {
            spawnFood();
          }
        }, 7000);
      }
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.2;
        const speed = 1.5 + Math.random() * 2;
        particles.push({
          x: (x + 0.5) * CELL_SIZE,
          y: (y + 0.5) * CELL_SIZE,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: color,
          alpha: 1,
          size: 2.5 + Math.random() * 2
        });
      }
    }

    function update() {
      if (!isRunning || isPaused || isGameOver) return;

      direction = { ...nextDirection };
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      // Colisión contra bordes
      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
        gameOver();
        return;
      }

      // Colisión contra sí misma
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Comprobar comida
      if (head.x === food.x && head.y === food.y) {
        const earned = food.special ? 30 : 10;
        score += earned;
        scoreEl.textContent = score;

        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snake_highscore', highScore.toString());
        }

        level = Math.floor(score / 50) + 1;
        levelEl.textContent = level;

        if (food.special) {
          sounds.playSpecialEat();
          createParticles(food.x, food.y, '#f59e0b');
        } else {
          sounds.playEat();
          createParticles(food.x, food.y, '#10b981');
        }

        spawnFood();
      } else {
        snake.pop();
      }

      // Actualizar partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.05;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      // Limpiar fondo
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dibujar cuadrícula sutil
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      // Dibujar comida
      if (food.special) {
        // Brillo dorado especial
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#f59e0b';
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(
          food.x * CELL_SIZE + CELL_SIZE / 2,
          food.y * CELL_SIZE + CELL_SIZE / 2,
          CELL_SIZE / 2 - 2,
          0,
          Math.PI * 2
        );
        ctx.fill();
        ctx.shadowBlur = 0; // Reset
      } else {
        // Manzana roja / rubí
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ef4444';
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(
          food.x * CELL_SIZE + CELL_SIZE / 2,
          food.y * CELL_SIZE + CELL_SIZE / 2,
          CELL_SIZE / 2 - 3,
          0,
          Math.PI * 2
        );
        ctx.fill();
        ctx.shadowBlur = 0; // Reset
      }

      // Dibujar serpiente
      snake.forEach((seg, index) => {
        const isHead = index === 0;
        const x = seg.x * CELL_SIZE;
        const y = seg.y * CELL_SIZE;
        const radius = isHead ? 6 : 4;

        if (isHead) {
          ctx.fillStyle = '#34d399';
          ctx.shadowBlur = 10;
          ctx.shadowColor = 'rgba(16, 185, 129, 0.6)';
        } else {
          // Gradiente según longitud
          const progress = index / snake.length;
          ctx.fillStyle = `rgb(${Math.floor(16 - progress * 10)}, ${Math.floor(185 - progress * 50)}, ${Math.floor(129 - progress * 40)})`;
          ctx.shadowBlur = 0;
        }

        ctx.beginPath();
        ctx.roundRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2, radius);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Ojos en la cabeza
        if (isHead) {
          ctx.fillStyle = '#064e3b';
          const eyeOffset = 5;
          const eyeSize = 3;

          let eye1 = { x: x + 5, y: y + 5 };
          let eye2 = { x: x + CELL_SIZE - 5 - eyeSize, y: y + 5 };

          if (direction.x === 1) {
            eye1 = { x: x + CELL_SIZE - 6, y: y + 4 };
            eye2 = { x: x + CELL_SIZE - 6, y: y + CELL_SIZE - 7 };
          } else if (direction.x === -1) {
            eye1 = { x: x + 4, y: y + 4 };
            eye2 = { x: x + 4, y: y + CELL_SIZE - 7 };
          } else if (direction.y === 1) {
            eye1 = { x: x + 4, y: y + CELL_SIZE - 6 };
            eye2 = { x: x + CELL_SIZE - 7, y: y + CELL_SIZE - 6 };
          } else if (direction.y === -1) {
            eye1 = { x: x + 4, y: y + 4 };
            eye2 = { x: x + CELL_SIZE - 7, y: y + 4 };
          }

          ctx.fillRect(eye1.x, eye1.y, eyeSize, eyeSize);
          ctx.fillRect(eye2.x, eye2.y, eyeSize, eyeSize);
        }
      });

      // Dibujar partículas
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function gameStep() {
      update();
      draw();

      if (isRunning && !isPaused && !isGameOver) {
        // Velocidad incrementa ligeramente con el nivel
        const speedMultiplier = Math.max(0.65, 1 - (level - 1) * 0.04);
        const currentSpeed = baseSpeed * speedMultiplier;
        gameLoopTimeout = setTimeout(gameStep, currentSpeed);
      }
    }

    function startGame() {
      sounds.init();
      sounds.playClick();
      resetGame();
      isRunning = true;
      hideOverlay();
      pauseBtn.textContent = '⏸';
      draw();
      clearTimeout(gameLoopTimeout);
      gameLoopTimeout = setTimeout(gameStep, baseSpeed);
    }

    function togglePause() {
      if (!isRunning || isGameOver) return;

      isPaused = !isPaused;
      sounds.playClick();

      if (isPaused) {
        pauseBtn.textContent = '▶';
        showOverlay('Juego Pausado', 'Presiona Espacio o Reanudar', 'paused', 'Reanudar');
      } else {
        pauseBtn.textContent = '⏸';
        hideOverlay();
        gameStep();
      }
    }

    function gameOver() {
      isGameOver = true;
      isRunning = false;
      sounds.playGameOver();
      showOverlay('¡Juego Terminado!', `Puntaje final: ${score}`, 'game-over', 'Jugar de nuevo');
    }

    function showOverlay(title, subtitle, className = '', buttonText = 'Iniciar') {
      overlayTitle.textContent = title;
      overlaySubtitle.textContent = subtitle;
      overlay.className = `overlay active ${className}`;
      startBtn.textContent = buttonText;
    }

    function hideOverlay() {
      overlay.className = 'overlay';
    }

    function setDirection(dx, dy) {
      if (isPaused) return;
      // Prevenir giro de 180 grados instantáneo
      if (dx !== 0 && direction.x !== 0) return;
      if (dy !== 0 && direction.y !== 0) return;
      nextDirection = { x: dx, y: dy };
    }

    // --- Control Listeners ---
    window.addEventListener('keydown', e => {
      const key = e.key;

      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) {
        e.preventDefault(); // Evita scroll de la ventana
      }

      if (key === 'ArrowUp' || key === 'w' || key === 'W') {
        setDirection(0, -1);
      } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
        setDirection(0, 1);
      } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
        setDirection(-1, 0);
      } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
        setDirection(1, 0);
      } else if (key === ' ' || key === 'p' || key === 'P') {
        if (!isRunning || isGameOver) {
          startGame();
        } else {
          togglePause();
        }
      } else if (key === 'Enter') {
        if (!isRunning || isGameOver || isPaused) {
          startGame();
        }
      }
    });

    // Botones de pantalla
    startBtn.addEventListener('click', () => {
      if (isPaused) {
        togglePause();
      } else {
        startGame();
      }
    });

    pauseBtn.addEventListener('click', togglePause);

    restartBtn.addEventListener('click', () => {
      sounds.playClick();
      startGame();
    });

    soundToggleBtn.addEventListener('click', () => {
      const enabled = sounds.toggle();
      soundToggleBtn.textContent = enabled ? '🔊' : '🔇';
    });

    difficultySelect.addEventListener('change', () => {
      baseSpeed = SPEED_MAP[difficultySelect.value] || SPEED_MAP.normal;
    });

    // D-Pad móvil
    document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));

    // Pantalla de inicio inicial
    resetGame();
    draw();
    showOverlay('🐍 Snake Game', 'Presiona Iniciar para comenzar', '', '▶ Iniciar Juego');
  </script>
</body>
</html>
